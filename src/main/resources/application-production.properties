spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# UTR API Configuration
# SECURITY BEST PRACTICES:
# 1. Set the token via the UTR_API_TOKEN environment variable
#    Example: export UTR_API_TOKEN=your_actual_token_here
# 2. Never commit actual tokens to version control
# 3. Consider using a secrets management solution for production environments
utr.api.token=${UTR_API_TOKEN}

# Database Configuration
# SECURITY BEST PRACTICES:
# 1. Set database credentials via environment variables:
#    - SPRING_DATASOURCE_URL
#    - SPRING_DATASOURCE_USERNAME
#    - SPRING_DATASOURCE_PASSWORD
# 2. Never commit actual credentials to version control
# 3. Consider using a secrets management solution for production environments
spring.jpa.hibernate.ddl-auto=none
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.datasource.tomcat.initial-size=15
spring.datasource.tomcat.max-wait=20000
spring.datasource.tomcat.max-active=50
spring.datasource.tomcat.max-idle=15
spring.datasource.tomcat.min-idle=8
spring.datasource.tomcat.default-auto-commit=true
#spring.jpa.show-sql=true

logging.level.org.hibernate=error
logging.level.com.utr=info
logging.level.com.utr.match=info
logging.level.com.utr.match.batch=info

# Google Sheets Configuration
# SECURITY BEST PRACTICES:
# 1. Set Google API credentials via environment variables:
#    - GOOGLE_SPREADSHEET_ID
#    - GOOGLE_CREDENTIALS_FILE_PATH
# 2. Store credential files securely and restrict access
application.name=MatchApp
spreadsheet.id=${GOOGLE_SPREADSHEET_ID}
credentials.file.path=${GOOGLE_CREDENTIALS_FILE_PATH}
tokens.directory.path=${GOOGLE_TOKENS_DIRECTORY_PATH:tokens}
